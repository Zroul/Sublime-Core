<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBSIDIAN</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="obsidian" aria-label="OBSIDIAN After Effects assistant">
    <header class="topbar">
      <div class="brand">
        <span>OBSIDIAN</span>
      </div>
      <button id="captions-open" class="menu-button captions-open" type="button" aria-label="Generate captions" title="Generate captions">CC</button>
      <button id="menu" class="menu-button" type="button" aria-label="OBSIDIAN menu">☰</button>
    </header>

    <section class="welcome" aria-live="polite">
      <div class="welcome-orb" aria-hidden="true">
        <span></span>
      </div>
      <h1 id="welcome-message">READY WHEN U ARE</h1>
    </section>

    <section class="composer-wrap">
      <form id="command-form" class="composer">
        <textarea
          id="command"
          rows="1"
          maxlength="1000"
          autocomplete="off"
          spellcheck="false"
          placeholder="Ask OBSIDIAN to edit..."
          aria-label="OBSIDIAN command"
        ></textarea>
        <button id="voice" class="action-button voice-button" type="button" aria-label="Voice command">●</button>
        <button class="action-button send-button" type="submit" aria-label="Send command">↑</button>
      </form>
    </section>

    <section id="caption-workspace" class="caption-workspace hidden" role="dialog" aria-modal="true" aria-labelledby="caption-title">
      <header class="caption-header">
        <div>
          <strong id="caption-title">Local captions</strong>
          <span>Review first. Nothing changes until you create captions.</span>
        </div>
        <button id="captions-close" type="button" aria-label="Close captions">×</button>
      </header>
      <p class="caption-privacy">Audio stays on this computer. OBSIDIAN uses cached local Whisper and does not upload footage.</p>
      <section id="caption-pipeline" class="caption-pipeline hidden" aria-live="polite">
        <svg id="caption-progress-line" class="caption-progress-line" viewBox="0 0 320 16" preserveAspectRatio="none" role="progressbar" aria-label="Local caption transcription" aria-valuemin="0" aria-valuemax="100" aria-busy="true">
          <defs>
            <linearGradient id="caption-progress-glow" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="var(--aura-accent)" stop-opacity=".18"></stop>
              <stop offset=".45" stop-color="var(--aura-cyan)" stop-opacity=".95"></stop>
              <stop offset=".55" stop-color="#efffff" stop-opacity=".95"></stop>
              <stop offset="1" stop-color="var(--aura-accent)" stop-opacity=".2"></stop>
            </linearGradient>
          </defs>
          <path class="caption-progress-wave" pathLength="1000" d="M1 8 C14 2.5 27 13.5 40 8 S66 2.5 79 8 105 13.5 118 8 144 2.5 157 8 183 13.5 196 8 222 2.5 235 8 261 13.5 274 8 300 2.5 319 8"></path>
        </svg>
        <p id="caption-pipeline-error" class="caption-pipeline-error hidden" role="alert"></p>
      </section>
      <div class="caption-controls">
        <label>Timing
          <select id="caption-mode"><option value="phrase">Readable phrases</option><option value="word">Word by word</option></select>
        </label>
        <label>Style
          <select id="caption-style"><option value="clean">Clean white</option><option value="bold">Bold white</option><option value="yellow">Yellow emphasis</option></select>
        </label>
      </div>
      <button id="captions-transcribe" class="caption-primary" type="button">Transcribe selected footage</button>
      <label class="caption-transcript-label" for="caption-transcript">Editable transcript (SRT timing)</label>
      <textarea id="caption-transcript" spellcheck="true" placeholder="After local transcription, review and edit the caption text and timing here." aria-label="Editable captions in SRT format"></textarea>
      <div class="caption-footer">
        <button id="captions-cancel" type="button">Cancel</button>
        <button id="captions-create" class="caption-primary" type="button" disabled>Create caption layers</button>
      </div>
      <p id="caption-status" class="caption-status" aria-live="polite"></p>
    </section>

    <div id="progress" class="progress hidden" aria-live="polite">
      <div class="progress-head">
        <span id="progress-label">Working...</span>
        <span id="progress-value">0%</span>
      </div>
      <div class="progress-track">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
    </div>

    <div id="result" class="result hidden" aria-live="polite">
      <span class="result-mark">✓</span>
      <span id="result-text">Done</span>
    </div>
  </main>

  <script src="knowledge.js"></script>
  <script src="creative-recipes.js"></script>
  <script src="captions.js"></script>
  <script src="caption-progress.js"></script>
  <script src="style-recipes.js"></script>
  <script src="planner.shared.js"></script>
  <script src="host-bridge.js"></script>
  <script src="app.js"></script>
  <script>
  (() => {
    const themes = ["violet", "ice", "ember", "rose", "mint"];
    let current = Math.max(0, themes.indexOf(document.documentElement.dataset.auraTheme || "violet"));
    document.documentElement.dataset.auraTheme = themes[current];
    const attach = () => {
      const menu = document.getElementById("menu");
      if (!menu || document.getElementById("aura-theme-toggle")) return;
      const btn = document.createElement("button");
      btn.id = "aura-theme-toggle";
      btn.type = "button";
      btn.title = "Change AURA accent theme";
      btn.setAttribute("aria-label", "Change AURA accent theme");
      btn.textContent = "◉ THEME";
      btn.addEventListener("click", () => {
        current = (current + 1) % themes.length;
        document.documentElement.dataset.auraTheme = themes[current];
        btn.textContent = "◉ " + themes[current].toUpperCase();
      });
      menu.insertAdjacentElement("beforebegin", btn);
    };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", attach);
    else attach();
  })();
  </script>
</body>
</html>
