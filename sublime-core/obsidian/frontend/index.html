<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBSIDIAN</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="obsidian" aria-label="OBSIDIAN After Effects assistant">
    <header class="topbar">
      <div class="brand">
        <span>OBSIDIAN</span>
      </div>
      <button id="menu" class="menu-button" type="button" aria-label="OBSIDIAN menu">☰</button>
    </header>

    <section class="welcome" aria-live="polite">
      <div class="welcome-orb" aria-hidden="true">
        <span></span>
      </div>
      <h1 id="welcome-message">READY WHEN U ARE</h1>
    </section>

    <section class="composer-wrap">
      <form id="command-form" class="composer">
        <textarea
          id="command"
          rows="1"
          maxlength="1000"
          autocomplete="off"
          spellcheck="false"
          placeholder="Ask OBSIDIAN to edit..."
          aria-label="OBSIDIAN command"
        ></textarea>
        <button id="voice" class="action-button voice-button" type="button" aria-label="Voice command">●</button>
        <button class="action-button send-button" type="submit" aria-label="Send command">↑</button>
      </form>
    </section>

    <div id="progress" class="progress hidden" aria-live="polite">
      <div class="progress-head">
        <span id="progress-label">Working...</span>
        <span id="progress-value">0%</span>
      </div>
      <div class="progress-track">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
    </div>

    <div id="result" class="result hidden" aria-live="polite">
      <span class="result-mark">✓</span>
      <span id="result-text">Done</span>
    </div>
  </main>

  <script src="knowledge.js"></script>
  <script src="style-recipes.js"></script>
  <script src="planner.shared.js"></script>
  <script src="app.js"></script>
  <script>
  (() => {
    const themes = ["violet", "ice", "ember", "rose", "mint"];
    let current = Math.max(0, themes.indexOf(document.documentElement.dataset.auraTheme || "violet"));
    document.documentElement.dataset.auraTheme = themes[current];
    const attach = () => {
      const menu = document.getElementById("menu");
      if (!menu || document.getElementById("aura-theme-toggle")) return;
      const btn = document.createElement("button");
      btn.id = "aura-theme-toggle";
      btn.type = "button";
      btn.title = "Change AURA accent theme";
      btn.setAttribute("aria-label", "Change AURA accent theme");
      btn.textContent = "◉ THEME";
      btn.addEventListener("click", () => {
        current = (current + 1) % themes.length;
        document.documentElement.dataset.auraTheme = themes[current];
        btn.textContent = "◉ " + themes[current].toUpperCase();
      });
      menu.insertAdjacentElement("beforebegin", btn);
    };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", attach);
    else attach();
  })();
  </script>
</body>
</html>
